<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 64 64" width="64" height="64">
  <!--
    Град: монета платформы (символ набла, от градиентного спуска). Один символ
    на все страницы; navigation.js вставляет его в документ, дальше
    <use href="#grad-coin"/>. Градиенты объявлены внутри символа.
  -->
  <symbol id="grad-coin" viewBox="0 0 64 64">
    <defs>
      <linearGradient id="grad-coin-rim" x1="10" y1="6" x2="54" y2="58" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#fbe08a"/>
        <stop offset="0.45" stop-color="#e2a52c"/>
        <stop offset="1" stop-color="#9a6410"/>
      </linearGradient>
      <linearGradient id="grad-coin-face" x1="18" y1="14" x2="48" y2="52" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#f6cf5c"/>
        <stop offset="1" stop-color="#d69420"/>
      </linearGradient>
      <linearGradient id="grad-coin-glyph" x1="22" y1="22" x2="42" y2="44" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#7a4d08"/>
        <stop offset="1" stop-color="#4f3004"/>
      </linearGradient>
      <radialGradient id="grad-coin-shine" cx="22" cy="18" r="30" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
        <stop offset="0.6" stop-color="#ffffff" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <!-- тень ребра -->
    <circle cx="32" cy="33.5" r="30" fill="#6b4408" opacity="0.35"/>
    <!-- ребро с насечкой -->
    <circle cx="32" cy="32" r="30" fill="url(#grad-coin-rim)"/>
    <circle cx="32" cy="32" r="27.6" fill="none" stroke="#7a4d08" stroke-opacity="0.45" stroke-width="1.6" stroke-dasharray="1.4 2.2"/>
    <!-- поле монеты -->
    <circle cx="32" cy="32" r="24" fill="url(#grad-coin-face)" stroke="#8a5a0c" stroke-width="1.2"/>
    <circle cx="32" cy="32" r="21.5" fill="none" stroke="#fff3c4" stroke-opacity="0.55" stroke-width="0.8"/>
    <!-- ∇: тиснение — светлый край сверху, тёмный глиф -->
    <path d="M20.5 22.2 H43.5 L32 43.2 Z" fill="none" stroke="#fff3c4" stroke-opacity="0.7" stroke-width="1.4" stroke-linejoin="round" transform="translate(0 -1)"/>
    <path d="M20.5 22.2 H43.5 L32 43.2 Z" fill="url(#grad-coin-glyph)" stroke="#3d2503" stroke-width="0.9" stroke-linejoin="round"/>
    <path d="M25.2 25.4 H38.8 L32 37.8 Z" fill="url(#grad-coin-face)"/>
    <!-- блик -->
    <circle cx="32" cy="32" r="30" fill="url(#grad-coin-shine)"/>
  </symbol>
  <use href="#grad-coin"/>
</svg>
